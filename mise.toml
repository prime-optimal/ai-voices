[env]
# Defaults live in main.py: provider fal, voice "Joe Rogan" (Robot_Armor on budgetpixel).
# Override per call: VOICE="Wise_Woman" mise run say ...   PROVIDER=budgetpixel mise run say ...
# main.py loads FAL_API_KEY / BUDGETPIXEL_SESSION from fnox.toml itself (via `fnox get`).

[tasks.say]
description = "Generate speech with the default voice (Joe Rogan on fal.ai). No text → prompts for multi-line input"
alias = "s"
usage = 'arg "[text]" help="Text to speak (quotes optional)" var=#true'
run = '''
eval "set -- ${usage_text:-}"  # usage_text is shell-quoted words; unquote
uv run main.py -- "$@"
'''

[tasks.voice]
description = "Pick a voice interactively, then enter text"
alias = "v"
run = "uv run main.py --pick"

[tasks.voices]
description = "List voices (optional search term for budgetpixel, e.g. `PROVIDER=budgetpixel mise run voices robot`)"
usage = 'arg "[query]" help="Filter by name, ID, language or category (budgetpixel)"'
run = 'uv run main.py --list-voices ${usage_query:+--search "$usage_query"}'

[tasks.models]
description = "List BudgetPixel TTS models"
run = "uv run main.py --list-models"

[tasks.login]
description = "Store a fresh budgetpixel.com session cookie in fnox (paste __Secure-next-auth.session-token)"
run = "fnox set BUDGETPIXEL_SESSION --provider age"

[tasks.install]
description = "Install the `voice` command into ~/.local/bin (editable: code changes apply immediately)"
run = "uv tool install --editable --force ."
