[project]
name = "ai-voices"
version = "2.1.0"
description = "Command-line text-to-speech generator (BudgetPixel and fal.ai MiniMax voices)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fal-client>=0.8.1",
    "prompt-toolkit>=3.0.52",
    "requests>=2.31.0",
    "rich>=14.2.0",
    "textual>=6.5.0",
]

[project.scripts]
voice = "main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "budgetpixel", "voices"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = false
annotated_tag = true
